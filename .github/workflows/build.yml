name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build with make
        run: |
          make clean
          make

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: capslock_ime_toggle
          path: capslock_ime_toggle.exe

      - name: Snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: capslock_ime_toggle.exe
        run: |
          gh release delete v0.0.0 --cleanup-tag --yes
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/v0.0.0"
          $releaseArgs = @(
            $env:FILES
            '--target'
            $env:GITHUB_SHA
            '--title'
            'Snapshot release'
            '--notes'
            "Automated snapshot of main at $env:GITHUB_SHA."
            '--prerelease'
            '--latest=false'
          )
          gh release create v0.0.0 @releaseArgs
